
<div *ngIf="data" role="region" aria-labelledby="chartTitle">
  <p-chart type="pie" [data]="data" [options]="options"
           aria-label="Pie Chart showing study and working time distribution"
           role="img"/>
  <h5 class="graphic-name" id="chartTitle">{{ 'PIE_GRAPHIC.TITLE' | translate }}</h5>
</div>
