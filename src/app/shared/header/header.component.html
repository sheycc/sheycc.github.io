<!-- Header -->
<div class="switch-container">
  <a (click)="switchLanguage('en')"
     #englishButton
     class="icon brands fi fi-gb"
     aria-label="Switch to English">
  </a>

  <span>|</span>

  <a (click)="switchLanguage('es')"
     #spanishButton
     class="icon brands fi fi-es"
     aria-label="Switch to Spanish">
  </a>
</div>
<header id="header">
  <a [routerLink]="['/portafolio']" class="logo" aria-label="Ir al portafolio de Sheyla Cruz Castro">
    <strong>{{ 'HEADER.PORTFOLIO' | translate }}</strong> - <span class="typing">Sheyla Cruz Castro</span></a>
  <ul class="icons" role="listbox" aria-label="Redes sociales">
    <!-- Botones para cambiar idioma -->
    <li role="option"><a href='https://www.linkedin.com/in/sheycc/' class="icon brands fa-linkedin waving-icon" aria-label="Linkedin de Sheyla Cruz Castro" target="_blank" rel="noopener noreferrer">
      <span class="label">LinkedIn</span></a>
    </li>
    <li role="option"><a href='https://github.com/sheycc' class="icon brands fa-github waving-icon" aria-label="GitHub de Sheyla Cruz Castro" target="_blank" rel="noopener noreferrer">
      <span class="label">GitHub</span></a>
    </li>
    <li *ngIf="isAdmin()"><a class="icon brands action waving-icon" (click)="logout()" aria-label="Cerrar sesión">
      <i class="fa-solid fa-right-from-bracket"></i></a>
    </li>
  </ul>
</header>
